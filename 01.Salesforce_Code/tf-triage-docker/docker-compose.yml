version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triagepass
      POSTGRES_DB: triagedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  web:
    build: .
    environment:
      - DATABASE_URL=postgresql+psycopg2://triage:triagepass@postgres:5432/triagedb
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - INDEX_PATH=/app/index_data/tf_index.faiss
      - META_PATH=/app/index_data/tf_meta.json
    volumes:
      - ./:/app
      - indexdata:/app/index_data
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://triage:triagepass@postgres:5432/triagedb
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - INDEX_PATH=/app/index_data/tf_index.faiss
      - META_PATH=/app/index_data/tf_meta.json
    volumes:
      - ./:/app
      - indexdata:/app/index_data
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
  redisdata:
  indexdata:
